name: umbrella_mobile
description: Professional Flutter MVP mobile app for the Umbrella streaming and creator monetization platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  video_player: ^2.9.5
  chewie: ^1.11.0
  intl: ^0.20.2
  uuid: ^4.5.1
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
